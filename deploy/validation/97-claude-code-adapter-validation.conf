# M2G — Claude Code adapter: live validation runtime.
#
# STAGED, NOT INSTALLED. This file lives in the repository, not in
# ~/.config/systemd/user/cofferdam-workstation.service.d/. Dropping it into that
# directory arms it on the next daemon-reload, so it is kept out until the user
# chooses to run the validation — see docs/checklists/m2g-claude-adapter-validation.md
# for the pre-state to record first and the exact install and rollback commands.
#
# Points the always-on workstation service at the standalone validation clone for
# branch `feat/claude-code-adapter`. Layered on top of the 10- … 96- drop-ins,
# which are NOT edited: the later file wins for the settings below, and
# everything else — COFFERDAM_HOME, the device token, the live registries, the
# bind address — is inherited from them untouched.
#
# On the number: 96- is the Agent Task Core validation layer and systemd applies
# drop-in filenames byte-wise, so "97-" sorts after it. "100-" would NOT: byte
# order puts "1" before "9", so a 100- file would be overridden by 96- rather
# than overriding it. That is the same reasoning that produced 95- rather than
# 100- for the YouTube layer.
#
# Rollback is removing this one file:
#
#   rm ~/.config/systemd/user/cofferdam-workstation.service.d/97-claude-code-adapter-validation.conf
#   systemctl --user daemon-reload
#   systemctl --user restart cofferdam-workstation.service
#
# That returns the service to the unchanged 96-agent-task-core runtime.
#
# WHAT BECOMES POSSIBLE THAT WAS NOT BEFORE — read this before switching:
#
#   * This runtime can START A REAL CLAUDE CODE PROCESS. It is the first
#     Cofferdam runtime that can run an agent, and the first that can change
#     files because somebody typed a sentence into a phone.
#   * It can do so ONLY inside a project listed in task-projects.json, and only
#     with an adapter that project names. For this validation that is the single
#     disposable sandbox at
#     ~/cofferdam/validation/claude-adapter-sandbox — a small standalone Git
#     repository holding no secrets, no credential or browser data, and no
#     Cofferdam production state. It is safe to delete and recreate.
#   * Claude has NO SHELL here. The tool profile is Read, Write, Edit, Glob and
#     Grep; Bash is absent from the session rather than gated behind an
#     approval. It cannot leave the project folder, cannot reach an MCP server,
#     and cannot read any settings file that might widen that.
#   * One Claude task at a time. A second is refused, not queued.
#   * Cancelling a task signals only the process group Cofferdam created for it,
#     after re-verifying pid, /proc start time and group ownership. Spotify,
#     Opera, the daemon and any Claude session running in the user's own
#     terminal are untouched.
#
# The deterministic validation adapter is ALSO enabled, deliberately: it is what
# the merged Task Core baseline scenarios run against, and keeping it available
# means a regression in the foundation can be told apart from one in the adapter.
# Normal daily configuration must enable NEITHER.
#
# WRITE SURFACE — this is the one to read twice. Every earlier runtime could
# write at most one registry file. This one can write ARBITRARY FILES INSIDE THE
# SANDBOX PROJECT, because that is what a coding agent does. It cannot write
# anywhere else: the project root is re-verified immediately before each launch,
# every path component checked for symlinks, and the resolved path compared
# against the configured one.
#
# slots/a, worktrees/pr9-resume, every previous clone, the base unit, drop-ins
# 10-96, browser profiles, Spotify OAuth state and all credential stores are NOT
# touched by this.

[Service]
# ExecStart is a list; it must be cleared before being replaced.
ExecStart=
ExecStart=%h/cofferdam/clones/claude-code-adapter/.venv/bin/python -m cofferdam.workstation --enable-claude-code-adapter --enable-validation-task-adapter
WorkingDirectory=%h/cofferdam/clones/claude-code-adapter
