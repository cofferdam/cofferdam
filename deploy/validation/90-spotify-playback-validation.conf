# M2D — Spotify playback with user OAuth: live validation runtime.
#
# STAGED, NOT INSTALLED. This file lives in the repository, not in
# ~/.config/systemd/user/cofferdam-workstation.service.d/. Dropping it into that
# directory arms it on the next daemon-reload, so it is kept out until the user
# chooses to run the validation — see docs/checklists/m2d-spotify-validation.md
# for the pre-state to record first and the exact install and rollback commands.
#
# Points the always-on workstation service at the standalone validation clone for
# branch `feat/spotify-playback-oauth` (PR #18). Layered on top of the 10- … 80-
# drop-ins, which are NOT edited: later numbers win lexically for the two settings
# below, and everything else — COFFERDAM_HOME, the device token, the live
# registries, the bind address — is inherited from them untouched.
#
# Rollback is removing this one file:
#
#   rm ~/.config/systemd/user/cofferdam-workstation.service.d/90-spotify-playback-validation.conf
#   systemctl --user daemon-reload
#   systemctl --user restart cofferdam-workstation.service
#
# That returns the service to the unchanged 80-audio-control runtime.

[Service]
ExecStart=
ExecStart=%h/cofferdam/clones/spotify-playback-oauth/.venv/bin/python -m cofferdam.workstation
WorkingDirectory=%h/cofferdam/clones/spotify-playback-oauth
