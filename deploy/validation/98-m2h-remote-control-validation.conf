# M2H PR2 — Remote Control host: live validation runtime.
#
# STAGED, NOT INSTALLED. This file lives in the repository, not in
# ~/.config/systemd/user/cofferdam-rc@.service.d/. It is copied there by hand
# for one bounded validation spike and removed afterwards.
#
# It is a drop-in for the TEMPLATE `cofferdam-rc@.service`, not for the
# always-on workstation daemon. Installing it changes nothing about
# cofferdam-workstation.service, which keeps running the build it was started
# with — the spike must never require restarting the daemon.
#
# WHY IT EXISTS
#
# The shipped template's ExecStart points at the active runtime slot,
# %h/cofferdam/slots/a, which is the correct production contract and is
# deliberately not edited. During validation the code under test is in a feature
# clone that is not the active slot, so ExecStart is redirected the same way
# `97-claude-code-adapter-validation.conf` redirects the daemon: later drop-in
# wins for the settings below, everything else is inherited untouched.
#
# On the number: 98- sorts after 97- byte-wise, which is the same reasoning
# recorded in the earlier validation drop-ins. "100-" would NOT sort later.
#
# WHAT BECOMES POSSIBLE THAT WAS NOT BEFORE — read before installing:
#
#   * This runtime can START A REAL NATIVE CLAUDE REMOTE CONTROL HOST: an
#     interactive agent, reachable from claude.ai/code and the mobile app, with
#     the registered project directory as its working directory.
#   * It runs ONLY for a project listed in task-projects.json that has
#     explicitly set "remote_control_enabled": true. For this validation that is
#     the single disposable sandbox already used for the M2G adapter spike — a
#     standalone Git repository holding no secrets, no credential or browser
#     data, and no Cofferdam production state.
#   * Cofferdam reads the child's stdout to capture the session link and for
#     nothing else. It does not read, mirror or store conversation content, and
#     stdin is /dev/null so no prompt can be injected into the session.
#   * The captured link is written to an owner-only file under
#     state/remote-control/ and is cleared on stop and on every new generation.
#
# ROLLBACK is removing this one file and the template beside it:
#
#   systemctl --user stop 'cofferdam-rc@*.service'
#   rm ~/.config/systemd/user/cofferdam-rc@.service.d/98-m2h-remote-control-validation.conf
#   rmdir ~/.config/systemd/user/cofferdam-rc@.service.d
#   rm ~/.config/systemd/user/cofferdam-rc@.service
#   systemctl --user daemon-reload
#
# That leaves no Remote Control template installed at all, which is the state
# before the spike. cofferdam-workstation.service is not touched by any of it.

[Service]
# ExecStart is a list; it must be cleared before being replaced.
ExecStart=
ExecStart=%h/cofferdam/clones/claude-code-adapter/.venv/bin/python -m cofferdam.workstation.sessions.host %i
WorkingDirectory=%h/cofferdam/clones/m2h-remote-control-live
