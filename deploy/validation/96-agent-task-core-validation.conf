# M2F — Agent Task Core: live validation runtime.
#
# STAGED, NOT INSTALLED. This file lives in the repository, not in
# ~/.config/systemd/user/cofferdam-workstation.service.d/. Dropping it into that
# directory arms it on the next daemon-reload, so it is kept out until the user
# chooses to run the validation — see docs/checklists/m2f-task-core-validation.md
# for the pre-state to record first and the exact install and rollback commands.
#
# Points the always-on workstation service at the standalone validation clone for
# branch `feat/agent-task-core-foundation`. Layered on top of the 10- … 95-
# drop-ins, which are NOT edited: the later file wins for the settings below, and
# everything else — COFFERDAM_HOME, the device token, the live registries, the
# bind address — is inherited from them untouched.
#
# On the number: "96-", not "100-". systemd applies drop-ins in **byte-wise**
# lexicographic order of their filenames, so "100-" sorts immediately after "10-"
# and *before* "20-" … "95-". That was confirmed the expensive way during M2E: a
# "100-" file was installed, reloaded and restarted, and left WorkingDirectory
# pointing at the previous clone because the "90-" drop-in was applied after it.
# "96-" sorts after "95-" byte-wise and is unambiguous.
#
# (`systemd-analyze compare-versions` reports "95- < 100-", because that command
# implements *version* comparison. Drop-in filename ordering does not use it. The
# manual page's word "lexicographic" is literal.)
#
# Whatever the number, the checklist confirms the effective ExecStart with
# `systemctl --user show` after installing rather than trusting the name.
#
# ---------------------------------------------------------------------------
# The flag, and why it is only here
# ---------------------------------------------------------------------------
#
# `--enable-validation-task-adapter` registers the deterministic validation task
# adapter. It runs no program, calls no model, writes nothing to disk and imports
# nothing that could; it exists so the task lifecycle can be exercised end to end
# on a real host without invoking a real agent.
#
# It is off in every other configuration, and this drop-in is the only place in
# the repository that turns it on. A normal runtime must not carry this flag:
# after validation, remove this file, reload, and restart — the adapter list goes
# back to empty and there is nothing registered to run a task in.
#
# There is no route, request field or header that enables it, so a phone cannot
# reach it however this service is started.
#
# ---------------------------------------------------------------------------
# Projects
# ---------------------------------------------------------------------------
#
# Task Core resolves a project id to a verified root from
# $COFFERDAM_HOME/config/task-projects.json, which is host-owned and is NOT
# written by this drop-in — a systemd unit is the wrong place to decide which
# directories an agent may work in. Create it before validating; see
# examples/task-projects.json for the shape.
#
# Rollback is removing this one file:
#
#   rm ~/.config/systemd/user/cofferdam-workstation.service.d/96-agent-task-core-validation.conf
#   systemctl --user daemon-reload
#   systemctl --user restart cofferdam-workstation.service
#
# That returns the service to the unchanged 95-youtube-player runtime, with no
# task adapter registered.

[Service]
ExecStart=
ExecStart=%h/cofferdam/clones/agent-task-core/.venv/bin/python -m cofferdam.workstation --enable-validation-task-adapter
WorkingDirectory=%h/cofferdam/clones/agent-task-core
