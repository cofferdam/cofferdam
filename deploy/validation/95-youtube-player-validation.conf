# M2E — YouTube dedicated player: live validation runtime.
#
# STAGED, NOT INSTALLED. This file lives in the repository, not in
# ~/.config/systemd/user/cofferdam-workstation.service.d/. Dropping it into that
# directory arms it on the next daemon-reload, so it is kept out until the user
# chooses to run the validation — see docs/checklists/m2e-youtube-validation.md
# for the pre-state to record first and the exact install and rollback commands.
#
# Points the always-on workstation service at the standalone validation clone for
# branch `feat/youtube-dedicated-player`. Layered on top of the 10- … 90-
# drop-ins, which are NOT edited: the later file wins for the two settings below,
# and everything else — COFFERDAM_HOME, the device token, the live registries,
# the bind address — is inherited from them untouched.
#
# On the number, because it is not the obvious one: this file is "95-", not
# "100-". systemd applies drop-ins in **byte-wise** lexicographic order of their
# filenames, so "100-" sorts immediately after "10-" and *before* "20-" … "90-".
# A file called "100-…" would therefore be overridden by the M2D "90-" drop-in
# and the service would silently keep running the old clone.
#
# This was confirmed the expensive way rather than assumed. Installing a "100-"
# file, reloading and restarting left WorkingDirectory pointing at the M2D clone,
# and `systemctl --user cat` listed the drop-ins in the order systemd actually
# used:
#
#   10-pr10-validation-runtime.conf
#   100-youtube-player-validation.conf      <- applied second, so it loses
#   20-pr12-screenshot-validation.conf
#   ...
#   90-spotify-playback-validation.conf     <- applied last, so it wins
#
# Note that `systemd-analyze compare-versions` reports "90-… < 100-…", because
# that command implements *version* comparison. Drop-in filename ordering does
# not use it. The manual page's word "lexicographic" is literal.
#
# "95-" sorts after "90-" byte-wise and is unambiguous, so it wins. Whatever the
# number, the checklist confirms the effective ExecStart with
# `systemctl --user show` after installing rather than trusting the name.
#
# No second unit is needed. The player's loopback listener runs *inside* this
# same daemon and binds lazily, so there is nothing extra to start, nothing extra
# to stop on rollback, and no chance of the graphical session ending up owning
# the headless Cofferdam daemon. It binds 127.0.0.1 on an ephemeral port and is
# never reachable over Tailscale; removing this drop-in removes it with the rest
# of the process.
#
# Rollback is removing this one file:
#
#   rm ~/.config/systemd/user/cofferdam-workstation.service.d/95-youtube-player-validation.conf
#   systemctl --user daemon-reload
#   systemctl --user restart cofferdam-workstation.service
#
# That returns the service to the unchanged 90-spotify-playback runtime.

[Service]
ExecStart=
ExecStart=%h/cofferdam/clones/youtube-dedicated-player/.venv/bin/python -m cofferdam.workstation
WorkingDirectory=%h/cofferdam/clones/youtube-dedicated-player
