# Enable the Actions bridge internal caller on the workstation daemon.
#
# Install as:
#   ~/.config/systemd/user/cofferdam-workstation.service.d/20-actions-bridge-caller.conf
#
# This drop-in does exactly one thing, and the reason it is its own file rather
# than an edit to 10-claude-code-adapter.conf is that removing it must be a
# complete revocation. `rm` this file, restart the daemon, delete
# secrets/actions-bridge-internal-token, and the daemon knows one credential
# again — with the Claude Code adapter and every other host capability
# untouched.
#
# What turning this on actually does
# ----------------------------------
# It decides whether a SECOND internal credential exists. That is the whole
# change. It registers no adapter, adds no route, opens no port, and starts no
# bridge process — the bridge is a separate systemd unit that this daemon knows
# nothing about.
#
# Once the file exists, ten task routes accept it in addition to the device
# token and record which credential arrived, so a task the bridge created is
# durably labelled `origin = chatgpt_app` instead of impersonating somebody's
# phone. The daemon's other routes keep the unchanged `require_token`, which has
# never heard of this credential — so a bridge request to /api/remote-control is
# a 401 because nothing there can recognise it, not because a check said no.
#
# What is NOT here, and must never be
# -----------------------------------
# The token value. This credential has no environment variable by design: two
# processes on one host read it from one 0600 file, and an env var would put a
# second copy of it somewhere visible in /proc and inherited by every child. The
# variable below is a boolean switch and nothing else.
#
# ExecStart is deliberately untouched, so this drop-in cannot move production to
# a different slot or a different checkout — the drift docs/DEPLOYMENT_PREFLIGHT.md
# was written about.
[Service]
Environment=COFFERDAM_ENABLE_ACTIONS_BRIDGE_CALLER=1
