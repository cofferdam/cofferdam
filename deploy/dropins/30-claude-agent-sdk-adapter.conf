# Register the Claude Agent SDK adapter on the workstation daemon (M2I.5 Gate B).
#
# Install as:
#   ~/.config/systemd/user/cofferdam-workstation.service.d/30-claude-agent-sdk-adapter.conf
#
# One file, one capability, and removing it is a complete revocation: `rm` this,
# restart the daemon, and the Agent SDK adapter is not constructed — with the
# Claude Code adapter, the Actions bridge caller, the runtime slot and every
# other host capability untouched. That is why it is its own file rather than an
# edit to 10-claude-code-adapter.conf.
#
# Why an environment variable and not a flag
# ------------------------------------------
# `--enable-claude-agent-sdk-adapter` exists and works, but putting it here would
# mean writing `ExecStart=` twice: once empty to clear the inherited value and
# once with BOTH adapter flags, because a drop-in's ExecStart replaces rather
# than appends. This file would then own the Claude Code flag as well, and
# removing it would silently take that adapter away too — the opposite of a
# complete revocation of one thing.
#
# `COFFERDAM_ENABLE_CLAUDE_AGENT_SDK_ADAPTER` is the same host-owned switch by a
# different door (config.py: environment > config.json > default), it is purely
# additive, and it leaves ExecStart alone — so this drop-in structurally cannot
# move production to another slot or another checkout, which is the drift
# docs/DEPLOYMENT_PREFLIGHT.md exists to catch. 20-actions-bridge-caller.conf is
# shaped this way for the same reason.
#
# What turning this on actually does
# ----------------------------------
# It constructs one more adapter object and puts it in the registry table. It
# starts no process: an Agent SDK helper exists only once a task is running, and
# there is no task until somebody creates one.
#
# It also does not select the adapter for anything. A project must list
# `claude-agent-sdk` in its `adapters` array to permit it, and — where the caller
# cannot name an adapter, which is every Actions-bridge create — must also
# delegate to it explicitly when more than one is permitted. Enabling the adapter
# on a host whose registry never mentions it changes nothing observable except
# the start-up line that says it is registered.
#
# Prerequisite: the `agent-sdk` extra must be installed in the slot's venv. It is
# not part of `workstation`; without it the adapter registers and reports itself
# unavailable, which is truthful but not useful.
#
# NO SECRET MAY EVER BE WRITTEN INTO THIS FILE. The variable below is a boolean
# switch and nothing else. The SDK session authenticates through the CLI already
# installed on this host, which Cofferdam reaches by passing `HOME` — it grants
# reachability, never possession.
[Service]
Environment=COFFERDAM_ENABLE_CLAUDE_AGENT_SDK_ADAPTER=1
