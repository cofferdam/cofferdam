name: license-scan

on:
  push:
  pull_request:

jobs:
  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LICENSE is present and Apache-2.0
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0" LICENSE
          echo "LICENSE present and looks like Apache-2.0."

      - name: Verify no disallowed license markers in tracked files
        run: |
          set -euo pipefail
          # This scanner necessarily contains the very markers it searches for,
          # so it excludes itself; otherwise it always matches and always fails.
          # -I skips binary files; --exclude-dir=.git skips git internals.
          if grep -RIl --exclude-dir=.git --exclude=license-scan.yml \
               -E "GPL-3\.0|AGPL|SSPL|proprietary" . ; then
            echo "Disallowed license marker found in the file(s) listed above." >&2
            exit 1
          fi
          echo "No disallowed license markers found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Review installed dependency licenses
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e ".[workstation,dev]" >/dev/null
          python .github/scripts/license_report.py

      # Cofferdam vendors no third-party source and distributes no bundled
      # dependencies, so no THIRD_PARTY_NOTICES.md is required today (see the
      # dependency policy in CONTRIBUTING.md). If that ever changes - a wheel,
      # container, or installer that bundles dependencies - the notices file
      # must be added in the same change and asserted here.
