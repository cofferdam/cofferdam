name: license-scan

on:
  push:
  pull_request:

jobs:
  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LICENSE is present and Apache-2.0
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0" LICENSE
          echo "LICENSE present and looks like Apache-2.0."

      - name: Verify no disallowed license markers in tracked files
        run: |
          set -euo pipefail
          # Purpose: catch a disallowed license being APPLIED to code in this
          # repository (a vendored GPL file, a source-available header), not any
          # mention of the words.
          #
          # A small set of files exists precisely to *discuss* license policy —
          # this scanner, the dependency-license tool it runs, the contribution
          # guide's dependency policy, and the dependency inventory. They name
          # the forbidden licenses on purpose, so matching them is a false
          # positive, the same self-matching problem this scanner always had
          # with itself. They are excluded **by path, explicitly** — the pattern
          # itself is not weakened, and every other tracked file is still
          # scanned. The substantive check on what is actually installed is the
          # dependency-license review step below.
          EXCLUDED='^(\.github/workflows/license-scan\.yml|\.github/scripts/license_report\.py|CONTRIBUTING\.md|docs/dependencies\.md)$'

          # Scan tracked files only (matching this step's name); -I skips binaries.
          mapfile -t FILES < <(git ls-files | grep -Ev "$EXCLUDED")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No files to scan - refusing to pass vacuously." >&2
            exit 1
          fi

          if grep -IlE "GPL-3\.0|AGPL|SSPL|proprietary" "${FILES[@]}"; then
            echo "Disallowed license marker found in the file(s) listed above." >&2
            exit 1
          fi
          echo "No disallowed license markers found in ${#FILES[@]} tracked files."

          # The excluded files are not unchecked: assert they only ever mention
          # these licenses as policy, and never carry a license grant of their own.
          if grep -InE "^[[:space:]]*(Licensed under|License:)[[:space:]]*(GNU|GPL|AGPL|SSPL)" \
               .github/workflows/license-scan.yml \
               .github/scripts/license_report.py \
               CONTRIBUTING.md \
               docs/dependencies.md ; then
            echo "A policy document appears to carry a disallowed license grant." >&2
            exit 1
          fi
          echo "Policy documents carry no disallowed license grant."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Review installed dependency licenses
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e ".[workstation,dev]" >/dev/null
          python .github/scripts/license_report.py

      # Cofferdam vendors no third-party source and distributes no bundled
      # dependencies, so no THIRD_PARTY_NOTICES.md is required today (see the
      # dependency policy in CONTRIBUTING.md). If that ever changes - a wheel,
      # container, or installer that bundles dependencies - the notices file
      # must be added in the same change and asserted here.
