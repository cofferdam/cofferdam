[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cofferdam"
description = "An open-source personal AI workstation: control your always-on Ubuntu desktop from your phone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Efe Aydınalp" }]
keywords = ["ai", "agents", "workstation", "remote-control", "ubuntu", "safety"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
# The Trust Core module stays standard-library-only, so the base install has no
# runtime dependencies. The workstation service (M1) is an extra.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Dependency decision (M1): FastAPI+uvicorn is the DECISIONS.md R-2 baseline —
# native WebSocket support, testable without a running server, and one
# toolchain (Python) for the whole product. psutil supplies cross-platform host
# metrics so /proc parsing does not have to be reimplemented per platform.
# All are permissively licensed (MIT / BSD-3-Clause). See docs/host-setup.md.
workstation = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
]
# The Claude Agent SDK adapter (M2I, Lane B). Its own extra, not part of
# `workstation`, because the adapter is off by default and most installs will
# never enable it — and because this dependency is not small.
#
# Three things a reader should know before installing it. The published wheel is
# about 91 MB: it bundles its own Claude Code CLI binary, which Cofferdam does
# not use (the adapter pins the CLI already installed on the host). It requires
# Python 3.10, while Cofferdam itself supports 3.9, hence the marker — on 3.9 the
# extra installs nothing and the adapter reports itself unavailable, which is the
# truthful outcome rather than a failed install. And the upper bound is
# deliberate: the SDK is pre-1.0 and its own classifiers say alpha, so a minor
# bump is allowed to change the API this adapter was written against.
#
# Verified against claude-agent-sdk 0.2.134 (MIT). See
# `cofferdam/workstation/tasks/adapters/claude_agent_sdk/sdk.py` for the
# evidence record and `docs/CLAUDE_AGENT_SDK_ADAPTER.md` for the boundary.
agent-sdk = [
    "claude-agent-sdk>=0.2.134,<0.3; python_version >= '3.10'",
]
# Test-only extras (the Trust Core suite itself needs nothing beyond stdlib).
dev = [
    "httpx>=0.27",
]

[project.scripts]
cofferdam = "cofferdam.cli:main"
cofferdam-workstation = "cofferdam.workstation.__main__:main"

[tool.setuptools]
# Listed explicitly rather than auto-discovered. `find:` would also sweep up
# `tests` and any future top-level directory that happens to gain an
# `__init__.py`, and a packaging list that changes because somebody added a file
# elsewhere is not a list anybody can review.
#
# The cost of being explicit is that a new subpackage must be added here, and
# that cost was paid the hard way: `tasks` (M2F) and its adapters (M2G) were
# never added, so a built wheel silently omitted Task Core and the Claude
# adapter. Nothing caught it because the documented install is editable
# (`pip install -e`), which puts the source tree on `sys.path` and makes the
# declaration irrelevant — the gap only appears in a real wheel.
#
# `tests/test_packaging.py` now compares this list against the packages that
# actually exist in the source tree, so the next omission fails a test instead
# of shipping.
packages = [
    "cofferdam",
    "cofferdam.workstation",
    "cofferdam.workstation.adapters",
    "cofferdam.workstation.audio",
    "cofferdam.workstation.mediasearch",
    "cofferdam.workstation.registries",
    "cofferdam.workstation.runtime",
    "cofferdam.workstation.sessions",
    "cofferdam.workstation.spotifyplayer",
    "cofferdam.workstation.tasks",
    "cofferdam.workstation.tasks.adapters",
    "cofferdam.workstation.tasks.adapters.claude_agent_sdk",
    "cofferdam.workstation.tasks.adapters.claude_code",
    "cofferdam.workstation.youtubeplayer",
]

[tool.setuptools.dynamic]
version = { attr = "cofferdam.__version__" }
