[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cofferdam"
description = "A controlled workspace where AI agents propose, reviews weigh in, and humans decide what crosses the boundary."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Efe Aydınalp" }]
keywords = ["ai", "agents", "code-review", "safety", "approval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
# No runtime dependencies: v0.1 is standard-library-first by policy.
dependencies = []
dynamic = ["version"]

[project.scripts]
cofferdam = "cofferdam.cli:main"

[tool.setuptools]
packages = ["cofferdam"]

[tool.setuptools.dynamic]
version = { attr = "cofferdam.__version__" }
